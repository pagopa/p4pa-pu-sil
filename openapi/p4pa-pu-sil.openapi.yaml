openapi: 3.0.1
info:
  title: p4pa-pu-sil
  description: Api and Models
  version: "1.0.0"
paths:
  /sil/organization/{organizationId}/send-notification:
    post:
      tags:
        - SendNotification
      summary: Create notification
      description: Create initial notification
      operationId: createSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: 'CreateNotificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'CreateNotificationResponse'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /sil/organization/{organizationId}/send-notification/{sendNotificationId}:
    get:
      tags:
        - SendNotification
      summary: get send notification
      description: get send notification
      operationId: getSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'SendNotificationDTO'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Notification not found
        '500':
          description: Internal server error
    delete:
      tags:
        - SendNotification
      summary: Delete notification
      description: Delete notification
      operationId: deleteSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /internal/orgSilService/{orgSilServiceId}/actualization:
    get:
      tags:
        - Actualization
      summary: actualize amount
      description: actualize amount
      operationId: actualize
      parameters:
        - name: orgSilServiceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nav
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualizationResultDTO'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
  /internal/orgSilService/{orgSilServiceId}/notify-payment:
    get:
      tags:
        - notifyPayment
      summary: notifyPayment
      description: notifies the payment details executed
      operationId: notifyPayment
      parameters:
        - name: orgSilServiceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nav
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: 'PuSilErrorDTO'
security:
  - BearerAuth: []
components:
  schemas:
    ActualizationResultDTO:
      type: object
      properties:
        updatedAmountCents:
          type: integer
          format: int64
          description: updated amount (in euro cents), if the invocation was successful
        balance:
          type: string
          description: updated balance envelope string, if service active, if successful invocation and balance envelope returned from discounting service
        errorCode:
          type: string
          description: Error code in case of KO outcome
        errorDescription:
          type: string
          description: Error description in case of KO outcome
        nav:
          type: string
          description: Debt Position unique number
        iun:
          type: string
          description: Unique identifier of the notification
        notificationFeeCents:
          type: integer
          format: int64
          description: Notification fee amount (in euro cents)
        displayDate:
          type: string
          format: date-time
          description: date of ISO 8601 display of the notification by the recipient
        completionDeadlineDate:
          type: string
          format: date-time
          description: ISO 8601 date of completion due to expiry of deadline
    PuSilErrorDTO:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
        message:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
