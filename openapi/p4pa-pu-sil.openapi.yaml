openapi: 3.0.1
info:
  title: p4pa-pu-sil
  description: Api and Models
  version: "1.0.0"
paths:
  /sil/organization/{organizationId}/send-notification:
    post:
      tags:
        - SendNotification
      summary: Create notification
      description: Create initial notification
      operationId: createSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: 'CreateNotificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'CreateNotificationResponse'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /sil/organization/{organizationId}/send-notification/{sendNotificationId}:
    get:
      tags:
        - SendNotification
      summary: get send notification
      description: get send notification
      operationId: getSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'SendNotificationDTO'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Notification not found
        '500':
          description: Internal server error
    delete:
      tags:
        - SendNotification
      summary: Delete notification
      description: Delete notification
      operationId: deleteSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /internal/orgSilService/{orgSilServiceId}/actualization:
    get:
      tags:
        - Actualization
      summary: actualize amount
      description: actualize amount
      operationId: actualize
      parameters:
        - name: orgSilServiceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nav
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualizationResultDTO'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /internal/orgSilService/{orgSilServiceId}/notify-payment:
    get:
      tags:
        - notifyPayment
      summary: notifyPayment
      description: notifies the payment details executed
      operationId: notifyPayment
      parameters:
        - name: orgSilServiceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: nav
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/import:
    post:
      tags:
        - Massive
      summary: request a massive import operation
      description: |
        Service to request a massive import operation. The upload of the file
        is done invoking the url returned by this service.
      operationId: massiveImportRequest
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
        - name: fileTypeAndVersion
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ImportFileTypeAndVersion'
        - name: fileName
          in: query
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFileResponseDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/import/{importId}:
    get:
      tags:
        - Massive
      summary: request processing status of massive import operation
      description: |
        Service to request the processing status of massive import operation and the url to download
        output files (where applicable, based on processing status and import type).
      operationId: massiveImportStatus
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
        - name: importId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatusResponseDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/export:
    post:
      tags:
        - Massive
      summary: request a massive export operation
      description: Service to request a massive export operation.
      operationId: massiveExportRequest
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequestDTO"
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileResponseDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/export/{exportId}:
    get:
      tags:
        - Massive
      summary: request processing status of export operation
      description: |
        Service to request the processing status of export operation and the url to download
        output files (where applicable, based on processing status and export type).
      operationId: massiveExportStatus
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
        - name: exportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStatusResponseDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/debt-position:
    post:
      tags:
        - DebtPosition
      summary: create a single debt position
      description: |
        Service to create a single debt position.
      operationId: createSingleDebtPosition
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtPositionDTO"
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtPositionDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/debt-position/{iud}:
    put:
      tags:
        - DebtPosition
      operationId: manageDebtPositionInstallments
      summary: manage a single debt position
      description: |
        Service to manage a single debt position, allowing to add, modify or delete one or more installments.
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
        - name: iud
          in: path
          required: true
          schema:
            type: string
          description: The IUD of any installment of the debtPosition/paymentOption that will be managed by this operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManageDebtPositionDTO"
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtPositionDTO'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuSilErrorDTO"
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/payment:
    post:
      tags:
        - Payment
      summary: request an immediate payment operation
      description: |
        Request an immediate payment operation, passing in input payment data,
        and receiving in output the url to trigger the payment operation.
      operationId: requestImmediatePayment
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImmediatePaymentRequest"
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/payment/notice/{nav}:
    get:
      tags:
        - Payment
      summary: handle the payment of an already existing payment notice
      description: |
        Service to request the start of online payment of a payment notice, or alternatively the download
        of notice as PDF file; in input accepts the notice number, and if the notice is payable, returns
        the url to trigger the payment operation and the url to download the PDF notice file; if the notice
        is not payable, returns the reason of error.
      operationId: requestNoticePayment
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
        - name: nav
          description: the notice number of the notice to pay
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NoticeNumber'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/payment/{idType}/{id}:
    get:
      tags:
        - Payment
      summary: request processing status of payment operation
      description: |
        Service to request the processing status of payment operation and the url to download
        output files (where applicable, based on processing status and export type).
      operationId: paymentStatus
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
        - name: idType
          description: the type of identifier used to identify the payment operation
          in: path
          required: true
          schema:
            type: string
            enum:
              - PAYMENT_ID
              - NOTICE_NUMBER
              - IUD
        - name: id
          description: the identifier used to identify the payment
          in: path
          required: true
          schema:
            type: string
        - name: withReceiptBytes
          description: if true, the response will contain the receipt bytes
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponseDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
  /sil/organization/{orgFiscalCode}/assessment/{searchType}:
    get:
      tags:
        - Assessment
      summary: retrieve the assessment data
      description: |
        Service to retrieve the assessment data given the reporting id (IUF) or invoice data.
      operationId: getAssessment
      parameters:
        - name: orgFiscalCode
          description: the fiscal code of the organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrgFiscalCode'
        - name: searchType
          description: the type of identifier used to identify the assessment
          in: path
          required: true
          schema:
            type: string
            enum:
              - REPORTING
              - BILL
        - name: searchParams
          in: query
          description: |
            If type = REPORTING, then only iuf must be set;
            if type = BILL, then only billYear and billNumber must be set.
          required: true
          style: form
          explode: true
          schema:
            type: object
            properties:
              iuf:
                type: string
              billYear:
                type: number
              billNumber:
                type: string
            oneOf:
              - required: [iuf]
              - required: [billYear , billNumber]
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAssessmentResponseDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuSilErrorDTO'
security:
  - BearerAuth: []
components:
  schemas:
    ActualizationResultDTO:
      type: object
      properties:
        updatedAmountCents:
          type: integer
          format: int64
          description: updated amount (in euro cents), if the invocation was successful
        balance:
          type: string
          description: updated balance envelope string, if service active, if successful invocation and balance envelope returned from discounting service
        errorCode:
          type: string
          description: Error code in case of KO outcome
        errorDescription:
          type: string
          description: Error description in case of KO outcome
        nav:
          type: string
          description: Debt Position unique number
        iun:
          type: string
          description: Unique identifier of the notification
        notificationFeeCents:
          type: integer
          format: int64
          description: Notification fee amount (in euro cents)
        displayDate:
          type: string
          format: date-time
          description: date of ISO 8601 display of the notification by the recipient
        completionDeadlineDate:
          type: string
          format: date-time
          description: ISO 8601 date of completion due to expiry of deadline
    PuSilErrorDTO:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - INVALID_FILE
            - FILE_UPLOAD_ERROR
            - CONFLICT
            - UNAUTHORIZED
            - GENERIC_ERROR
        message:
          type: string
    OrgFiscalCode:
      type: string
      pattern: '^\d{11}$'
    NoticeNumber:
      type: string
      pattern: '^\d{18}$'
    ImportFileTypeAndVersion:
      type: string
      enum:
        - DEBT_POSITION_1_5
        - PAYMENTS_1_0
        - TREASURY_OPI_1_0
        - TREASURY_POSTE_1_0
    ImportFileResponseDTO:
      type: object
      required:
        - importId
        - uploadUrl
      properties:
        importId:
          type: string
        uploadUrl:
            type: string
            description: The url to upload the file to, using a POST request with the file as body.
    DownloadUrl:
      type: object
      required:
        - type
        - url
      properties:
        code:
          type: string
          enum:
            - INPUT_FILE
            - OUTPUT_FILE
            - DISCARDED_FILE
            - PAYMENT_NOTICE_FILE
        url:
          type: string
    ImportStatusResponseDTO:
      type: object
      required:
        - importId
        - status
      properties:
        importId:
          type: string
        status:
          type: string
          enum:
            - TO_PROCESS
            - PROCESSING
            - PROCESSED
            - ABORTED
        lastUpdateDateTime:
          type: string
          format: date-time
        downloadUrls:
          type: array
          items:
            $ref: '#/components/schemas/DownloadUrl'
    ExportRequestDTO:
      type: object
      required:
        - exportId
        - exportTypeAndVersion
        - exportFilters
      properties:
        exportId:
          type: string
        exportTypeAndVersion:
          $ref: "#/components/schemas/ExportFileTypeAndVersion"
        exportFilters:
          type: object
          additionalProperties:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
              value:
                type: string
        exportFlags:
          type: object
          required:
            - key
            - value
          additionalProperties:
            type: object
            properties:
              key:
                type: string
              value:
                type: boolean
    ExportFileTypeAndVersion:
      type: string
      enum:
        - DEBT_POSITION_1_0
        - DEBT_POSITION_1_1
        - DEBT_POSITION_1_2
        - DEBT_POSITION_1_3
        - CLASSIFICATION_1_0
        - CLASSIFICATION_1_1
        - CLASSIFICATION_1_2
        - CLASSIFICATION_1_3
        - CLASSIFICATION_1_4
    ExportFileResponseDTO:
      type: object
      required:
        - exportId
      properties:
        exportId:
          type: string
    ExportStatusResponseDTO:
      type: object
      required:
        - exportId
        - status
      properties:
        exportId:
          type: string
        status:
          type: string
          enum:
            - TO_PROCESS
            - PROCESSING
            - PROCESSED_OK
            - PROCESSED_ERROR
            - PROCESSED_NO_DATA
            - PROCESSED_MAX_ROWS_EXCEEDED
        lastUpdateDateTime:
          type: string
          format: date-time
        downloadUrl:
          $ref: "#/components/schemas/DownloadUrl"
    PaymentDTO:
      required:
        - debtPositionTypeOrgCode
        - amountCents
        - debtor
        - remittanceInformation
        - transfers
      type: object
      properties:
        debtPositionTypeOrgCode:
          type: string
        iud:
          type: string
        notificationFeeCents:
          type: integer
          format: int64
        amountCents:
          type: integer
          format: int64
        remittanceInformation:
          type: string
        balance:
          type: string
        debtor:
          $ref: "#/components/schemas/PersonDTO"
        transfers:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/TransferDTO"
    PersonDTO:
      required:
        - fullName
        - entityType
        - fiscalCode
      type: object
      properties:
        entityType:
          type: string
          enum:
            - F
            - G
        fiscalCode:
          type: string
        fullName:
          type: string
        address:
          type: string
        civic:
          type: string
        postalCode:
          type: string
        location:
          type: string
        province:
          type: string
        nation:
          type: string
        email:
          type: string
    ImmediatePaymentRequest:
      required:
        - payments
      type: object
      properties:
        payments:
          type: array
          description: the payments data
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/PaymentDTO"
        callbackUrl:
          type: string
          description: |
            the url to redirect the navigation flow to, after completing the payment operation.
            If not set, a generic PU page will be used. The parameters paymentId and outcome (OK/KO)
            will be added to query string of url.
    PaymentResponse:
      type: object
      properties:
        triggerPaymentUrl:
          type: string
          description: the url to trigger the payment operation
        downloadNoticeUrl:
          type: string
          description: the url to download the payment notice as pdf file (not applicable to immediate payments)
        paymentId:
          type: string
          description: id to query payment operation status
        outcome:
          type: string
          description: the outcome of payment request
          enum:
            - OK
            - ALREADY_PAID
            - NOT_PAYABLE
            - NOT_FOUND
    PaymentStatusResponseDTO:
      type: object
      required:
        - paymentId
        - status
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum:
            - NOT_PAID
            - PAID
        receipt:
          $ref: "#/components/schemas/ReceiptWithAdditionalNodeDataDTO"
        receiptBytes:
          type: string
          format: binary
        lastUpdateDateTime:
          type: string
          format: date-time
    ReceiptDTO:
      type: object
      required:
        - receiptOrigin
        - paymentReceiptId
        - noticeNumber
        - orgFiscalCode
        - outcome
        - creditorReferenceId
        - paymentAmountCents
        - description
        - companyName
        - idPsp
        - pspCompanyName
        - idChannel
        - channelDescription
        - debtor
      properties:
        paymentReceiptId:
          type: string
        noticeNumber:
          type: string
        paymentNote:
          type: string
        orgFiscalCode:
          type: string
        outcome:
          type: string
        creditorReferenceId:
          type: string
        paymentAmountCents:
          type: integer
          format: int64
        description:
          type: string
        companyName:
          type: string
        officeName:
          type: string
        idPsp:
          type: string
        pspFiscalCode:
          type: string
        pspPartitaIva:
          type: string
        pspCompanyName:
          type: string
        idChannel:
          type: string
        channelDescription:
          type: string
        paymentMethod:
          type: string
        feeCents:
          type: integer
          format: int64
        paymentDateTime:
          type: string
          format: date-time
        applicationDate:
          type: string
          format: date-time
        transferDate:
          type: string
          format: date-time
        standin:
          type: boolean
        debtor:
          $ref: "#/components/schemas/PersonDTO"
        payer:
          $ref: "#/components/schemas/PersonDTO"
    ReceiptTransferDTO:
      required:
        - idTransfer
        - transferAmountCents
        - fiscalCodePA
        - remittanceInformation
        - transferCategory
      type: object
      properties:
        idTransfer:
          type: integer
          format: int32
        transferAmountCents:
          type: integer
          format: int64
        fiscalCodePA:
          type: string
        companyName:
          type: string
        mbdAttachment:
          type: string
          format: byte
        iban:
          type: string
        remittanceInformation:
          type: string
        transferCategory:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    ReceiptWithAdditionalNodeDataDTO:
      allOf:
        - $ref: "#/components/schemas/ReceiptDTO"
        - type: object
          required:
            - transfers
          properties:
            transfers:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ReceiptTransferDTO"
            metadata:
              type: object
              additionalProperties:
                type: string
    GetAssessmentResponseDTO:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/BalanceDTO"
    BalanceDTO:
      type: object
      required:
