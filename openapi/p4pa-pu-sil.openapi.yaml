openapi: 3.1.0
info:
  title: p4pa-pu-sil
  description: Api and Models
  version: "1.0.0"
paths:
  /sil/organization/{organizationId}/send-notification:
    post:
      tags:
        - SendNotification
      summary: Create notification
      description: Create initial notification
      operationId: createSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: 'CreateNotificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'CreateNotificationResponse'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /sil/organization/{organizationId}/send-notification/{sendNotificationId}:
    get:
      tags:
        - SendNotification
      summary: get send notification
      description: get send notification
      operationId: getSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'SendNotificationDTO'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Notification not found
        '500':
          description: Internal server error
    delete:
      tags:
        - SendNotification
      summary: Delete notification
      description: Delete notification
      operationId: deleteSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /internal/orgSilService/{orgSilServiceId}/amount-updates/legacy:
    get:
      tags:
        - AmountUpdatesLegacy
      summary: get amount updates
      description: get amount updates for backward compatibility legacy system
      operationId: getAmountUpdatesLegacy
      parameters:
        - name: orgSilServiceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: orgFiscalCode
          in: query
          required: true
          schema:
            type: string
        - name: nav
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmountUpdatesLegacyDTO'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Notification not found
        '500':
          description: Internal server error
security:
  - BearerAuth: []
components:
  schemas:
    AmountUpdatesLegacyDTO:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - OK
            - KO
        updatedAmount:
          type: integer
          format: int64
          description: updated amount (in euro cents), if the invocation was successful
        balance:
          type: string
          description: updated balance envelope string, if service active, if successful invocation and balance envelope returned from discounting service
        errorCode:
          type: string
          description: Error code in case of KO outcome
        errorDescription:
          type: string
          description: Error description in case of KO outcome
        isBlockingError:
          type: boolean
          description: Indicates if the error is blocking or not and whether the error is blocking for payment purposes
        nav:
          type: string
          description: Debt Position unique number
        iun:
          type: string
          description: Unique identifier of the notification
        notificationFee:
          type: integer
          format: int64
          description: Notification fee amount (in euro cents)
        displayDate:
          type: string
          format: date-time
          description: date of ISO 8601 display of the notification by the recipient
        completionDeadlineDate:
          type: string
          format: date-time
          description: ISO 8601 date of completion due to expiry of deadline
    PuSilErrorDTO:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
        message:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
