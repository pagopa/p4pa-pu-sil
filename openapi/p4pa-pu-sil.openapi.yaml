openapi: 3.1.0
info:
  title: p4pa-pu-sil
  description: Api and Models
  version: "1.0.0"
paths:
  /sil/organization/{organizationId}/send-notification:
    post:
      tags:
        - SendNotification
      summary: Create notification
      description: Create initial notification
      operationId: createSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: 'CreateNotificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'CreateNotificationResponse'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /sil/organization/{organizationId}/send-notification/{sendNotificationId}:
    get:
      tags:
        - SendNotification
      summary: get send notification
      description: get send notification
      operationId: getSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'SendNotificationDTO'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Notification not found
        '500':
          description: Internal server error
    delete:
      tags:
        - SendNotification
      summary: Delete notification
      description: Delete notification
      operationId: deleteSendNotification
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sendNotificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /internal/example:
    get:
      tags:
        - Example
      summary: get example
      description: get example that will be removed in the future
      operationId: getExample
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Notification not found
        '500':
          description: Internal server error
security:
  - BearerAuth: []
components:
  schemas:
    PuSilErrorDTO:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
        message:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
