legacy-auth:
  basic-legacy-expiration-seconds: "\${BASIC_LEGACY_AUTH_EXPIRATION_TIMEOUT_SECONDS:300}" # 5 minutes
  jwt-legacy-expiration-seconds: "${JWT_LEGACY_AUTH_EXPIRATION_TIMEOUT_SECONDS:3600}" # 1 hour

public-base-url:
  fileshare: "\${PUBLIC_BASE_URL_FILESHARE:}"
  pu-sil: "\${PUBLIC_BASE_URL_PU_SIL:}"

springdoc:
  writer-with-default-pretty-printer: true

checkout:
  default-callback-url:
    ok: "\${CHECKOUT_DEFAULT_CALLBACK_URL_OK:http://localhost:8080/checkout/ok}"
    ko: "\${CHECKOUT_DEFAULT_CALLBACK_URL_KO:http://localhost:8080/checkout/ko}"
    cancel: "\${CHECKOUT_DEFAULT_CALLBACK_URL_CANCEL:http://localhost:8080/checkout/cancel}"

cache:
  debtPositionTypeOrg:
    size: "\${CACHE_DEBTPOSITION_TYPE_ORG_SIZE:1000}"
    expire-in: "\${CACHE_DEBTPOSITION_TYPE_ORG_MINUTES:60}"
  debtPositionType:
    size: "\${CACHE_DEBTPOSITION_TYPE_SIZE:100}"
    expire-in: "\${CACHE_DEBTPOSITION_TYPE_MINUTES:60}"
